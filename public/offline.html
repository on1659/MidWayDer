<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오프라인 - MidWayDer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, -apple-system-font, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f8fafc;
      color: #0f172a;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      color: #3274f9;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    p {
      font-size: 1rem;
      color: #475569;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    button {
      background: #3274f9;
      color: white;
      border: none;
      padding: 0.875rem 2.5rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 24px rgba(50, 116, 249, 0.22);
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    button:active {
      transform: scale(0.98);
    }
    .logo {
      position: fixed;
      bottom: max(1.5rem, calc(1rem + env(safe-area-inset-bottom)));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">MidWayDer</div>
    <h1>오프라인 상태입니다</h1>
    <p>
      인터넷 연결을 확인한 후<br>
      다시 시도해주세요.
    </p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
  <div class="logo">MidWayDer</div>
</body>
</html>
